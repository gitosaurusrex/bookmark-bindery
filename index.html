<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; manifest-src 'self'; connect-src https://bookmark-bindery-ai.azureus.workers.dev; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<!-- Bindery Assist (optional AI). Empty means off. Set with: node scripts/set-ai-endpoint.mjs <worker URL> -->
<meta name="bindery-ai" content="https://bookmark-bindery-ai.azureus.workers.dev">
<meta name="description" content="Open a browser bookmarks export, inspect and reorganize every folder and link, review duplicates, and export a Chrome-ready file. Runs entirely in your browser.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121615" media="(prefers-color-scheme: dark)">
</head>
<body>
<title>Bookmark Bindery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&display=swap">
<style>
/* Layout: a bindery bench. The folder spine runs down the left, the open folder lies flat on a white sheet to the right,
   and whatever you pick up rides in a dark tray at the bottom until you put it somewhere. */
:root{
  --paper:#F2F4F1; --sheet:#FFFFFF; --ink:#1A201E; --ink-2:#56605B; --ink-3:#8A928E;
  --rule:#E1E5E1; --rule-2:#CFD5D0;
  --cloth:#2F4E9E; --cloth-ink:#253F80; --cloth-soft:#E7ECF8; --on-cloth:#FFFFFF;
  --hover:#EEF0EC; --select:#E2E8F7; --focus:#2F4E9E;
  --manila:#A97E2F; --manila-fill:#F5E9CF; --leaf:#2F7D52; --violet:#6B48C6; --teal:#1C7C88;
  --think-a:#8B5CF6; --think-b:#3B82F6; --think-a-soft:rgba(139,92,246,.18); --think-b-soft:rgba(59,130,246,.18);
  --danger:#B13A2E; --danger-soft:#FAE9E6; --on-danger:#FFFFFF;
  --tray:#1D2422; --tray-ink:#F1F3F0; --tray-dim:#9AA49F; --tray-hover:#2C3532; --tray-danger:#F2907F;
  --scrim:rgba(18,24,22,.38);
  --tile-s:38%; --tile-l:91%; --tile-ink:34%;
  --shadow:0 1px 2px rgba(20,28,25,.06),0 10px 30px rgba(20,28,25,.12);
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-ui:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --side-w:276px; --rail-w:58px; --ind-w:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121615; --sheet:#181D1B; --ink:#E5E9E6; --ink-2:#A4ADA8; --ink-3:#727B77;
  --rule:#252B29; --rule-2:#343B38;
  --cloth:#93A8F0; --cloth-ink:#B8C6F6; --cloth-soft:#1E2640; --on-cloth:#0F1630;
  --hover:#1F2523; --select:#1F2944; --focus:#93A8F0;
  --manila:#D4AD62; --manila-fill:#3A3020; --leaf:#73C99B; --violet:#B39EF5; --teal:#6CC6D1;
  --think-a:#A98BFA; --think-b:#6FA2FF; --think-a-soft:rgba(169,139,250,.22); --think-b-soft:rgba(111,162,255,.22);
  --danger:#EC7A6E; --danger-soft:#3A1F1C; --on-danger:#24100D;
  --tray:#E7EBE8; --tray-ink:#151A18; --tray-dim:#5E6763; --tray-hover:#D3D9D5; --tray-danger:#A9322A;
  --scrim:rgba(0,0,0,.55);
  --tile-s:28%; --tile-l:24%; --tile-ink:80%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#121615; --sheet:#181D1B; --ink:#E5E9E6; --ink-2:#A4ADA8; --ink-3:#727B77;
  --rule:#252B29; --rule-2:#343B38;
  --cloth:#93A8F0; --cloth-ink:#B8C6F6; --cloth-soft:#1E2640; --on-cloth:#0F1630;
  --hover:#1F2523; --select:#1F2944; --focus:#93A8F0;
  --manila:#D4AD62; --manila-fill:#3A3020; --leaf:#73C99B; --violet:#B39EF5; --teal:#6CC6D1;
  --think-a:#A98BFA; --think-b:#6FA2FF; --think-a-soft:rgba(169,139,250,.22); --think-b-soft:rgba(111,162,255,.22);
  --danger:#EC7A6E; --danger-soft:#3A1F1C; --on-danger:#24100D;
  --tray:#E7EBE8; --tray-ink:#151A18; --tray-dim:#5E6763; --tray-hover:#D3D9D5; --tray-danger:#A9322A;
  --scrim:rgba(0,0,0,.55);
  --tile-s:28%; --tile-l:24%; --tile-ink:80%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
kbd{font:500 11px/1 var(--f-mono);padding:3px 5px;border-radius:4px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink-2)}

.app{--side-cur:var(--side-w);height:100%;display:grid;grid-template-columns:var(--side-cur) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}

/* ---------- top bar ---------- */
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--paper);min-width:0}
.brand{display:flex;align-items:center;gap:8px;flex:none;width:calc(var(--side-cur) - 72px);min-width:0;overflow:hidden}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--cloth);color:var(--on-cloth);display:grid;place-items:center}
.brand .mark svg{width:15px;height:15px;stroke-width:1.7}
.brand .word{font:italic 500 21px/1 var(--f-display);letter-spacing:-.01em}
.file{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.file b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.file span{font-size:12px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.file .dirty{color:var(--manila)}
.search{flex:1;max-width:520px;margin-left:auto;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:9px;background:var(--sheet);border:1px solid var(--rule-2);color:var(--ink-3);min-width:0}
.search:focus-within{border-color:var(--cloth);box-shadow:0 0 0 3px var(--cloth-soft)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.tools{display:flex;align-items:center;gap:6px;flex:none}
.sep{width:1px;height:20px;background:var(--rule-2);margin:0 4px}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--rule-2);background:var(--sheet);font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--cloth);border-color:transparent;color:var(--on-cloth)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:transparent;color:var(--on-danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.on,.btn.on:hover{background:var(--cloth-soft);border-color:transparent;color:var(--cloth-ink)}
.btn.ghost:hover{background:var(--hover)}
.btn svg{color:currentColor}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:0;background:transparent;color:var(--ink-2)}
.icon-btn:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.icon-btn:disabled{opacity:.35;cursor:default}
.only-narrow{display:none}

/* ---------- sidebar ---------- */
.side{position:relative;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule);background:var(--paper)}
.side-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:16px 18px 6px}
.tree{position:relative;flex:1;min-height:80px;overflow:auto;padding:0 8px 8px}
.trow{position:relative;display:flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 calc(4px + var(--d) * 14px);border-radius:7px;color:var(--ink-2);cursor:pointer;user-select:none}
.trow:hover{background:var(--hover);color:var(--ink)}
.trow.on{background:var(--select);color:var(--cloth-ink);font-weight:500}
.trow.on .ficon{color:var(--cloth)}
.trow.drop-into{background:var(--cloth-soft);box-shadow:inset 0 0 0 1.5px var(--cloth)}
.trow.cut{opacity:.5}
.chev{width:18px;height:18px;display:grid;place-items:center;border:0;padding:0;background:transparent;color:var(--ink-3);border-radius:4px;flex:none}
.chev svg{width:12px;height:12px;stroke-width:1.8;transition:transform .15s}
.chev.open svg{transform:rotate(90deg)}
.chev.none{visibility:hidden}
.chev:hover{color:var(--ink)}
.ficon{display:grid;place-items:center;color:var(--manila)}
.ficon svg{fill:var(--manila-fill)}
.ficon.plain svg{fill:none}
.trow.on .ficon svg{fill:var(--cloth-soft)}
.tname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcount{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:400}
.trow .in-t{flex:1;min-width:0;height:24px}
.views{display:flex;flex-direction:column;padding:0 8px}
.vrow{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px 0 12px;border-radius:7px;border:0;background:transparent;color:var(--ink-2);text-align:left}
.vrow:hover{background:var(--hover);color:var(--ink)}
.vrow.on{background:var(--select);color:var(--cloth-ink);font-weight:500}
.vrow .tname{flex:1}
.side-foot{padding:10px 8px 14px;border-top:1px solid var(--rule);margin-top:10px}
.side-foot .vrow{width:100%}
.side-foot .side-h{padding:4px 12px 6px}
.vrow:disabled{opacity:.4;cursor:default}
.vrow:disabled:hover{background:transparent;color:var(--ink-2)}
.vrow.danger{color:var(--danger)}
.vrow.danger:hover:not(:disabled){background:var(--danger-soft);color:var(--danger)}
.switch{position:relative;flex:none;width:28px;height:16px;border-radius:8px;border:1.5px solid var(--ink-3);transition:background .15s,border-color .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;background:var(--ink-3);transition:transform .15s,background .15s}
.vrow[aria-checked="true"] .switch{background:var(--cloth);border-color:var(--cloth)}
.vrow[aria-checked="true"] .switch::after{background:var(--on-cloth);transform:translateX(12px)}
.dev-note{margin:2px 12px 10px;font-size:12px;line-height:1.4;color:var(--ink-3)}
.side-hrow{display:flex;align-items:center;gap:8px;padding-right:12px;padding-block:10px 2px}
.side-hrow>span:first-child{flex:1}
.side-tools{display:flex;gap:1px;letter-spacing:0;text-transform:none;opacity:0;transition:opacity .15s}
.side:hover .side-tools,.side:focus-within .side-tools,.side-tools.pinned{opacity:1}
.side-tools .icon-btn{width:26px;height:26px;border-radius:6px;color:var(--ink-3)}
.side-tools .icon-btn svg{width:14px;height:14px}
.side-tools .icon-btn.on{color:var(--cloth);background:var(--cloth-soft)}
.tfilter{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .18s ease,opacity .18s ease}
.tfilter.open{grid-template-rows:1fr;opacity:1}
.tfilter>div{overflow:hidden;min-height:0}
.tf-box{display:flex;align-items:center;gap:6px;height:32px;margin:4px 11px 6px;padding:0 3px 0 9px;border-radius:8px;background:var(--sheet);border:1px solid var(--rule-2);color:var(--ink-3)}
.tf-box:focus-within{border-color:var(--cloth);box-shadow:0 0 0 3px var(--cloth-soft)}
.tf-box svg{width:14px;height:14px}
.tf-box input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--ink);font-size:13px}
.tf-box input::placeholder{color:var(--ink-3)}
.tf-n{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tf-box .icon-btn{width:24px;height:24px;border-radius:6px}
.tf-box .icon-btn svg{width:12px;height:12px}
.trow.ctx .tname{color:var(--ink-3)}
.trow mark{padding:0 1px}
.tf-empty{margin:6px 12px;font-size:12.5px;color:var(--ink-3)}
.dropline{position:absolute;height:2px;background:var(--cloth);border-radius:2px;pointer-events:none;z-index:3}
.dropline::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;border:2px solid var(--cloth);background:var(--sheet)}

/* ---------- pane ---------- */
.pane{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--sheet)}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;padding:20px 24px 14px;border-bottom:1px solid var(--rule)}
.phead .ttl{flex:1 1 280px;min-width:0}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;min-height:20px;margin-bottom:4px;color:var(--ink-3);font-size:12.5px}
.crumbs svg{width:11px;height:11px;stroke-width:1.8}
.crumb{border:0;background:transparent;padding:1px 5px;border-radius:5px;color:var(--ink-2)}
.crumb:hover{background:var(--hover);color:var(--ink)}
.crumb.drop-into{background:var(--cloth-soft);color:var(--cloth-ink);box-shadow:inset 0 0 0 1.5px var(--cloth)}
.ptitle{margin:0;font:500 28px/1.15 var(--f-display);letter-spacing:-.012em;text-wrap:balance;overflow-wrap:anywhere}
.ptitle[data-rename]{cursor:text}
.ptitle-in{font:500 28px/1.15 var(--f-display);letter-spacing:-.012em;width:100%;border:0;outline:none;background:transparent;border-bottom:1.5px solid var(--cloth);padding:0}
.pmeta{margin-top:5px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pmeta .dim{color:var(--ink-3)}
.pacts{display:flex;flex-wrap:wrap;gap:6px}
.list{position:relative;flex:1;min-height:0;overflow:auto;outline:none}
.rows{position:relative}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink-3);pointer-events:none}
.empty h3{margin:0 0 4px;font:500 20px/1.2 var(--f-display);color:var(--ink-2)}
.empty p{margin:0;max-width:42ch}
.empty .watermark{display:block;width:112px;height:112px;margin:0 auto 20px;stroke:none;color:var(--cloth);opacity:.14}
.empty .watermark rect{fill:currentColor}
.empty .watermark path{fill:var(--sheet)}
.empty.blank-state h3{font-size:26px;margin-bottom:6px}
.empty.blank-state p{margin-inline:auto}
.empty .how{margin-top:12px;font-size:12.5px}
.app.blank .phead,.app.blank #tree,.app.blank .tfilter,.app.blank #views,.app.blank .side-h.lib{display:none}
.app.blank .side-foot{margin-top:auto}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{background:var(--sheet);filter:none}
.btn.primary:disabled:hover{background:var(--cloth)}
.search:has(input:disabled){opacity:.55}
.dialog h2.problem{color:var(--danger)}

.row{position:absolute;left:12px;right:12px;height:44px;display:flex;align-items:center;gap:10px;padding:0 6px 0 8px;border-radius:9px;user-select:none;-webkit-user-select:none}
.row:hover{background:var(--hover)}
.row.sel{background:var(--select)}
.list:focus .row.cur{box-shadow:inset 0 0 0 1.5px var(--focus)}
.row.cut{opacity:.42}
.row.drop-into{background:var(--cloth-soft);box-shadow:inset 0 0 0 1.5px var(--cloth)}
.row[data-editing]{background:var(--sheet);box-shadow:0 0 0 1px var(--rule-2),var(--shadow);z-index:2}
.check{width:18px;height:18px;flex:none;display:grid;place-items:center;border-radius:5px;border:1.5px solid var(--rule-2);background:var(--sheet);opacity:0;transition:opacity .1s}
.check svg{width:12px;height:12px;stroke-width:2.2;opacity:0}
.row:hover .check,.selecting .check{opacity:1}
.row.sel .check{background:var(--cloth);border-color:var(--cloth);color:var(--on-cloth)}
.row.sel .check svg{opacity:1}
.ico{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:6px;font:600 11.5px/1 var(--f-ui);overflow:hidden}
.ico img{width:16px;height:16px}
.ico.mono{background:hsl(var(--h) var(--tile-s) var(--tile-l));color:hsl(var(--h) 42% var(--tile-ink))}
.ico.fold{color:var(--manila)}
.ico.fold svg{width:20px;height:20px;stroke-width:1.3;fill:var(--manila-fill)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px}
.t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u{font:12px/1.35 var(--f-mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is-folder .u{font-family:var(--f-ui);font-size:12.5px}
.u .pill{font:600 10.5px/1 var(--f-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--manila);background:var(--manila-fill);padding:2px 6px;border-radius:4px}
mark{background:var(--manila-fill);color:inherit;border-radius:2px;box-shadow:0 0 0 1px var(--manila-fill)}
.where{flex:0 0 26%;min-width:0;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tail{position:relative;flex:0 0 104px;height:100%;display:flex;align-items:center;justify-content:flex-end}
.date{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-right:6px}
.acts{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;gap:2px;opacity:0;pointer-events:none}
.row:hover .acts,.list:focus .row.cur .acts{opacity:1;pointer-events:auto}
.row:hover .date,.list:focus .row.cur .date{opacity:0}
.acts .icon-btn{width:30px;height:30px;text-decoration:none}
.row.sel .acts .icon-btn:hover{background:var(--sheet)}
.main.editing{gap:3px}
.in-t,.in-u{width:100%;border:0;outline:1.5px solid var(--cloth);outline-offset:0;border-radius:5px;background:var(--sheet);padding:1px 6px;margin-left:-6px;min-width:0}
.in-t{font-weight:500;height:21px}
.in-u{font:12px/1.35 var(--f-mono);height:18px;color:var(--ink-2);outline-color:var(--rule-2)}
.in-u:focus{outline-color:var(--cloth)}
.grp{position:absolute;left:12px;right:12px;height:44px;display:flex;align-items:flex-end;gap:10px;padding:0 0 3px 8px;font:600 13px/1.3 var(--f-ui);color:var(--ink);border-bottom:1px solid var(--rule)}
.grp .gl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:5px}
.grp .mono{font:400 12px var(--f-mono);color:var(--ink-2)}
.grp .gl .mono:first-child{color:var(--ink);font-size:12.5px}
.grp .dim{color:var(--ink-3);margin-left:6px}
.grp .n{font:400 12px var(--f-ui);color:var(--ink-3);white-space:nowrap;padding-bottom:5px;font-variant-numeric:tabular-nums}
.grp.wiped .n{color:var(--danger);font-weight:500}
.grp .icon-btn{width:28px;height:28px}
.row.marked:not(.sel){background:var(--danger-soft)}
.row.marked .main{opacity:.6}
.row.marked .t{text-decoration:line-through;text-decoration-color:var(--danger);text-decoration-thickness:1.5px}
.keep-seg,.seg{flex:none;display:inline-flex;padding:2px;gap:2px;border-radius:8px;background:var(--paper);border:1px solid var(--rule)}
.keep-seg button,.seg button{border:0;background:transparent;border-radius:6px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.keep-seg button{height:26px;padding:0 10px;font-size:12.5px}
.keep-seg button:hover,.seg button:hover{color:var(--ink)}
.keep-seg button.on[data-a="keep"],.seg button.on{background:var(--sheet);color:var(--ink);box-shadow:0 0 0 1px var(--rule-2)}
.keep-seg button.on[data-a="del"]{background:var(--danger);color:var(--on-danger)}
.seg{padding:2px}
.seg button{height:26px;padding:0 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.seg .sc{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pmeta .del{color:var(--danger);font-weight:600}
.pmeta div.dim{margin-top:2px;font-size:12.5px}
.selbar .fill-danger{background:var(--tray-danger);color:var(--tray)}
.selbar .fill-danger:hover{background:var(--tray-danger);filter:brightness(1.08)}
.dialog p.warn{color:var(--danger);font-weight:500}
.urlcmp{display:grid;gap:6px;margin:14px 0 12px}
.urlcmp .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.urlcmp code{display:block;font:12.5px/1.55 var(--f-mono);padding:9px 11px;border-radius:8px;background:var(--paper);border:1px solid var(--rule);overflow-wrap:anywhere;word-break:break-all;max-height:9.5em;overflow:auto;color:var(--ink)}
.urlcmp del{text-decoration:line-through;text-decoration-color:var(--danger);background:var(--danger-soft);color:var(--danger);border-radius:3px}
.dialog .pk{font:12px var(--f-mono);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:0 4px}
.dialog p.note{font-size:12.5px;color:var(--ink-3)}
.preview .pv-where{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%;padding-left:8px}
.preview li .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#listLine{left:16px;right:16px}
.tw{--ind:var(--ind-w);flex:none;align-self:stretch;display:flex;align-items:center;margin-right:-4px}
.tw .indent{align-self:stretch;margin-block:-1px;width:calc(var(--d) * var(--ind));background:linear-gradient(to right,transparent calc(50% - .5px),var(--rule-2) calc(50% - .5px),var(--rule-2) calc(50% + .5px),transparent calc(50% + .5px)) 0 0/var(--ind) 100% repeat-x}
.twist{width:var(--ind);height:24px;flex:none;display:grid;place-items:center;border:0;padding:0;background:transparent;color:var(--ink-3);border-radius:5px}
.twist svg{width:12px;height:12px;stroke-width:1.9;transition:transform .15s}
.twist.open svg{transform:rotate(90deg)}
.twist.none{visibility:hidden}
.twist:hover{background:var(--rule);color:var(--ink)}
.seg svg{width:14px;height:14px}

/* ---------- selection tray & toasts ---------- */
.dock{position:absolute;left:0;right:0;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none;z-index:20}
.dock>*{pointer-events:auto}
.toast,.selbar{background:var(--tray);color:var(--tray-ink);border-radius:12px;box-shadow:var(--shadow);max-width:100%}
.toast{display:flex;align-items:center;gap:14px;padding:10px 10px 10px 16px;font-size:13.5px;animation:rise .18s ease-out}
.toast.err{background:var(--danger);color:var(--on-danger)}
.toast button{border:0;background:transparent;color:inherit;font-weight:600;padding:4px 8px;border-radius:6px;text-decoration:underline;text-underline-offset:3px}
.toast button:hover{background:var(--tray-hover)}
.selbar{display:flex;align-items:center;gap:2px;padding:6px;animation:rise .18s ease-out}
.selbar .count{padding:0 12px 0 10px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.selbar button{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px;border:0;border-radius:8px;background:transparent;color:inherit;font-weight:500;white-space:nowrap}
.selbar button:hover{background:var(--tray-hover)}
.selbar kbd{background:transparent;border-color:var(--tray-dim);color:var(--tray-dim)}
.selbar .danger{color:var(--tray-danger)}
.selbar .x{width:34px;padding:0;justify-content:center;color:var(--tray-dim)}
.selbar .div{width:1px;height:20px;background:var(--tray-hover);margin:0 4px}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ---------- menus & dialogs ---------- */
.menu{position:fixed;z-index:50;min-width:220px;max-width:min(320px,calc(100vw - 16px));padding:5px;border-radius:11px;background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow)}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border:0;border-radius:7px;background:transparent;text-align:left;color:var(--ink);text-decoration:none;font-size:13.5px}
.mi svg{color:var(--ink-3)}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:none}
.mi span{flex:1}
.mi kbd{border:0;background:transparent;padding:0;color:var(--ink-3)}
.mi.danger,.mi.danger svg{color:var(--danger)}
.mi.danger:hover{background:var(--danger-soft)}
.msep{height:1px;background:var(--rule);margin:5px 6px}
.mlabel{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:6px 10px 3px}
.mi.tall{height:auto;min-height:32px;padding:7px 10px;align-items:flex-start}
.mi small{display:block;margin-top:1px;font-size:12px;line-height:1.35;color:var(--ink-3)}
.mi .mcheck{width:16px;height:16px;flex:none;display:grid;place-items:center;border-radius:4px;border:1.5px solid var(--rule-2);margin-top:1px}
.mi .mcheck svg{width:11px;height:11px;stroke-width:2.2;color:var(--on-cloth)}
.mi[aria-checked="true"] .mcheck{background:var(--cloth);border-color:var(--cloth)}
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:16px;animation:fade .15s}
.dialog{width:min(500px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--sheet);border-radius:14px;box-shadow:var(--shadow);padding:22px 22px 18px;animation:rise .18s ease-out}
.dialog h2{margin:0 0 8px;font:500 23px/1.2 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.dialog p{margin:0 0 10px;color:var(--ink-2)}
.dialog .actions{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;margin-top:18px}
.dialog .actions .hint{margin-right:auto;font-size:12px;color:var(--ink-3)}
.preview{list-style:none;margin:12px 0 0;padding:6px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.preview li{display:flex;align-items:center;gap:9px;padding:4px 6px;min-width:0}
.preview li .t{font-weight:400}
.preview .more{color:var(--ink-3);font-size:12.5px;padding-left:39px}
.preview .ico{width:20px;height:20px;font-size:10px}
.preview .ico.fold svg{width:17px;height:17px}
.mp-list{margin-top:10px;max-height:min(46vh,380px);overflow:auto;border:1px solid var(--rule);border-radius:10px;padding:4px}
.mp-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px 4px}
.mp-row{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 10px 4px calc(10px + var(--d) * 16px);border-radius:7px;cursor:pointer}
.mp-row .ico{width:20px;height:20px}
.mp-row .ico svg{width:17px;height:17px}
.mp-row .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.mp-row .nm b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-row .nm small{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-row .tag{font-size:11.5px;color:var(--ink-3)}
.mp-row.act{background:var(--select)}
.mp-row.dis{opacity:.4;cursor:not-allowed}
.dialog .search{max-width:none;margin:0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;margin:14px 0 4px;align-items:center}
.keys dt{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.keys dd{margin:0;color:var(--ink-2)}
.keys .h{grid-column:1/-1;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
@keyframes fade{from{opacity:0}}

/* ---------- browsers ---------- */
.targets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 10px}
.targets button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--rule-2);background:var(--sheet);text-align:left}
.targets button:hover{background:var(--hover)}
.targets button b{font-weight:600;font-size:14.5px}
.targets button small{font-size:12.5px;color:var(--ink-3)}
.targets button.on{border-color:var(--cloth);background:var(--cloth-soft);box-shadow:0 0 0 3px var(--cloth-soft)}
.ffl{list-style:none;margin:6px 0 12px;padding:0;display:grid;gap:12px}
.ffl li{display:flex;gap:10px;align-items:flex-start;color:var(--ink-2)}
.ffl li>svg{flex:none;margin-top:2px;color:var(--ink-3)}
.ffl li>span{display:block;min-width:0;line-height:1.5}
.ffl .tagsas{display:flex;width:max-content;max-width:100%;margin-top:8px}
.ffl small{display:block;margin-top:5px}
.ffl label.cb{margin-top:7px}
.ffl b{color:var(--ink);font-weight:600}
.ffl.ok li>svg{color:var(--leaf)}
.ffl.warn li>svg{color:var(--manila)}
.ffl small{font-size:12px;color:var(--ink-3)}
.dialog label.cb{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.dialog label.cb input{margin:0;accent-color:var(--cloth)}
@media (max-width:600px){ .targets{grid-template-columns:1fr} .tagsas{flex-wrap:wrap} }

/* ---------- separators ---------- */
.row.is-sep{height:44px}
.sepline{flex:1;min-width:0;display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.sepline::before,.sepline::after{content:"";flex:1;height:0;border-top:1.5px dashed var(--rule-2)}
.sepline::before{flex:0 0 18px}
.ico.sepi{color:var(--ink-3)}
.insp .hint.insp-sep{margin-top:16px;font-size:13px;line-height:1.5}

/* ---------- tags ---------- */
.ico.tagi{color:var(--manila);background:var(--manila-fill)}
.ico.tagi svg{width:14px;height:14px}
.ico.tagi.ai{color:var(--violet);background:color-mix(in srgb,var(--violet) 14%,transparent)}
.grp.tsect{align-items:flex-end}
.row.simrow{cursor:default}
.row.tagrow .u,.row.simrow .u{font:12.5px/1.35 var(--f-ui)}
.row.simrow .t{display:flex;flex-wrap:nowrap;gap:6px;overflow:hidden}
.tname-c{display:inline-flex;align-items:baseline;gap:4px;padding:1px 8px;border-radius:10px;background:var(--paper);border:1px solid var(--rule);font-size:13px;white-space:nowrap}
.tname-c small{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.simacts{flex:none;display:flex;align-items:center;gap:4px}
.btn.small{height:28px;padding:0 10px;font-size:12.5px}
.dialog .opts{display:grid;gap:8px;margin:14px 0 4px;color:var(--ink-2)}
.dialog .opts label{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.dialog .opts input{margin:3px 0 0;accent-color:var(--cloth)}
.dialog .cf-list{max-height:min(34vh,280px)}
.mp-row .tag{margin-left:auto}
@media (max-width:600px){ .simacts .btn.small{max-width:120px;overflow:hidden;text-overflow:ellipsis} .row.simrow .u{display:none} }

/* ---------- bookmark editor ---------- */
:root{--insp-w:372px}
.app.insp-open{grid-template-columns:var(--side-cur) minmax(0,1fr) var(--insp-w)}
.insp{position:relative;grid-column:3;grid-row:2;min-height:0;display:flex;flex-direction:column;background:var(--sheet);border-left:1px solid var(--rule)}
.insp-h{display:flex;align-items:center;gap:10px;padding:14px 12px 12px 18px;border-bottom:1px solid var(--rule)}
.insp-ico{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--paper);border:1px solid var(--rule);color:var(--ink-3)}
.insp-ico .ico{width:26px;height:26px;font-size:13px}
.insp-ico .ico img{width:20px;height:20px}
.insp-ico .ico.blank{color:var(--ink-3)}
.insp-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.insp-t b{font:500 19px/1.2 var(--f-display);letter-spacing:-.005em}
.insp-t small{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insp-b{flex:1;min-height:0;overflow:auto;padding:2px 18px 18px}
.insp-f{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--rule)}
.insp-f .del{margin-right:auto;color:var(--danger);padding:0 8px}
.insp-f .del:hover{background:var(--danger-soft)}
.insp .hint{margin:4px 0 0;font-size:12px;color:var(--ink-3)}
.insp .hint.warn,.insp-meta .warn{color:var(--manila)}
.insp .nb-status{margin:8px 0 0}
.flabel-row{display:flex;align-items:center;justify-content:space-between;min-height:24px}
.insp-more{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.insp-more .chip{height:28px;padding:0 11px;box-shadow:none;color:var(--ink-2);font-size:12.5px}
.insp-more .chip svg{color:var(--ink-3);width:12px;height:12px}
.insp-meta{display:grid;gap:4px;margin-top:18px;padding-top:12px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-3)}
.insp-empty{flex:1;display:grid;place-content:center;justify-items:center;gap:14px;padding:24px;text-align:center;color:var(--ink-3)}
.insp-empty p{margin:0;max-width:26ch}
.insp-acts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip.small{height:24px;padding:0 9px;font-size:12px}
.chip.small svg{width:12px;height:12px}
.tagbox{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:38px;padding:5px 6px;border-radius:9px;border:1px solid var(--rule-2);background:var(--sheet)}
.tagbox:focus-within{border-color:var(--cloth);box-shadow:0 0 0 3px var(--cloth-soft)}
.tagbox input{flex:1;min-width:96px;height:26px;padding:0 5px;border:0;outline:none;background:transparent;color:var(--ink)}
.tg-list{display:contents}
.tg{display:inline-flex;align-items:center;gap:2px;height:26px;padding:0 3px 0 10px;border-radius:13px;background:var(--cloth-soft);color:var(--cloth-ink);font-size:12.5px;font-weight:500}
.tg button{width:20px;height:20px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:transparent;color:inherit}
.tg button:hover{background:color-mix(in srgb,var(--cloth) 18%,transparent)}
.tg button svg{width:11px;height:11px;stroke-width:2}
.tg.part{background:var(--sheet);border:1.5px dashed color-mix(in srgb,var(--cloth) 55%,transparent);padding-left:9px}
.tg.part small{font-size:10.5px;color:var(--ink-3);margin-left:3px;font-variant-numeric:tabular-nums}
.insp-acts.left{justify-content:flex-start;margin-top:18px}
.field>textarea{min-height:78px;resize:vertical;border-radius:9px;border:1px solid var(--rule-2);background:var(--sheet);padding:8px 11px;outline:none;color:var(--ink);font:inherit;line-height:1.45}
.field>textarea:focus{border-color:var(--cloth);box-shadow:0 0 0 3px var(--cloth-soft)}
.btn .caret{display:inline-grid;margin-left:-2px}
.btn .caret svg{width:11px;height:11px;stroke-width:1.9;transform:rotate(90deg)}
@media (max-width:1180px){
  .app.insp-open{grid-template-columns:var(--side-cur) minmax(0,1fr)}
  .insp{position:fixed;z-index:38;top:0;right:0;bottom:0;width:min(var(--insp-w),94vw);box-shadow:var(--shadow);animation:inspIn .2s ease-out}
}
@media (max-width:820px){ .app.insp-open{grid-template-columns:minmax(0,1fr)} }
@media (max-width:600px){
  .insp>.resizer{display:none}
  .insp{top:auto;left:0;width:auto;max-height:88vh;border-left:0;border-radius:18px 18px 0 0;animation:sheetUp .28s cubic-bezier(.2,.7,.2,1)}
  .insp-f{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
}
@keyframes inspIn{from{transform:translateX(28px);opacity:0}}
.field{display:grid;gap:5px;margin-top:14px;min-width:0}
.field>label,.field .flabel,.flabel-row label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.field>input{height:38px;min-width:0;border-radius:9px;border:1px solid var(--rule-2);background:var(--sheet);padding:0 11px;outline:none;color:var(--ink)}
.field>input:focus{border-color:var(--cloth);box-shadow:0 0 0 3px var(--cloth-soft)}
.field>input.url{font:13px var(--f-mono)}
.dialog p.nb-status{margin:8px 0 0;min-height:18px;font-size:12.5px;color:var(--ink-3)}
.dialog p.nb-status.warn{color:var(--manila)}
.dialog p.nb-status:empty{min-height:0;margin:0}
.nb-status .chip{height:24px;font-size:12px}
.fpick{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:4px 10px;border-radius:9px;border:1px solid var(--rule-2);background:var(--sheet);text-align:left}
.fpick:hover{background:var(--hover)}
.fpick[aria-expanded="true"]{border-color:var(--cloth)}
.fpick .nm{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fpick .nm small{font-weight:400;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.fpick>svg{transform:rotate(90deg);color:var(--ink-3)}
.fpick[aria-expanded="true"]>svg{transform:rotate(-90deg)}
.fp-panel{margin-top:6px;padding:8px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.fp-panel .mp-list{margin-top:8px;max-height:min(34vh,260px);background:var(--sheet)}
.mp-row.cur .tag{color:var(--cloth)}
.mp-row .tag svg{width:14px;height:14px}
.place-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.place-chips .chip{box-shadow:none}
.place-chips .chip svg{width:13px;height:13px}
.place-chips .chip:not(.ask):not(.busy):not(.quiet) svg{color:var(--manila)}
.chip.on{border-color:var(--cloth);background:var(--cloth-soft);color:var(--cloth-ink)}
.linkish{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;padding:0;color:var(--cloth-ink);font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkish svg{width:13px;height:13px;color:var(--violet)}
.dialog p.nb-assist{margin:14px 0 0;padding:10px 12px;border-radius:10px;background:var(--paper);font-size:12.5px}

/* ---------- bindery assist ---------- */
.vrow[data-view="tidy"] .ficon{color:var(--violet)}
.grp.tgrp{align-items:center;padding:0 4px 0 8px;font-weight:400;border-radius:0}
.grp.tgrp .gl{display:flex;align-items:center;gap:8px;padding:0;min-width:0}
.grp.tgrp .n{padding:0}
.grp.tgrp .ico{width:24px;height:24px}
.grp.drop-into{background:var(--cloth-soft);box-shadow:inset 0 0 0 1.5px var(--cloth);border-radius:9px}
.grp.toff .tg-name,.grp.toff .ico{opacity:.5}
.tcheck{width:18px;height:18px;flex:none;display:grid;place-items:center;padding:0;border-radius:5px;border:1.5px solid var(--rule-2);background:var(--sheet);color:var(--on-cloth)}
.tcheck.all,.tcheck.some{background:var(--cloth);border-color:var(--cloth)}
.tcheck svg{width:12px;height:12px;stroke-width:2.2}
.tg-name{min-width:0;border:0;background:transparent;padding:3px 6px;margin-left:-6px;border-radius:6px;font:600 14px/1.3 var(--f-ui);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
button.tg-name:hover{background:var(--hover)}
.tstay .tg-name{color:var(--ink-2);cursor:default}
.tg-in{font:600 14px/1.3 var(--f-ui);height:26px;max-width:320px;margin-left:0}
.tbadge{flex:none;font:500 11px/1 var(--f-ui);padding:4px 7px;border-radius:10px;background:var(--cloth-soft);color:var(--cloth-ink)}
.tbadge.ex{background:var(--manila-fill);color:var(--manila)}
.tidy-row .tsend{flex:none;color:var(--ink-3)}
.row.stays .main,.row.stays .ico{opacity:.5}
.stay-note{flex:none;font-size:12.5px;color:var(--ink-3);padding:0 10px}
.keep-seg button.on[data-a="tmove"],.keep-seg button.on[data-a="tstay"]{background:var(--sheet);color:var(--ink);box-shadow:0 0 0 1px var(--rule-2)}
.selbar .fill-primary{background:var(--tray-ink);color:var(--tray)}
.selbar .fill-primary:hover{background:var(--tray-ink);filter:brightness(.92)}
.selbar button:disabled{opacity:.45;cursor:default}
.main.editing{position:relative}
.name-chips{position:absolute;left:-6px;top:calc(100% + 15px);display:flex;flex-wrap:wrap;gap:6px;z-index:4;max-width:calc(100vw - 80px)}
.name-chips.head{position:static;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:15px;border:1px solid var(--rule-2);background:var(--sheet);color:var(--ink);font:500 13px var(--f-ui);white-space:nowrap;box-shadow:0 2px 8px rgba(20,28,25,.1)}
.chip:hover,.chip:focus-visible{border-color:var(--cloth);background:var(--cloth-soft)}
.chip svg{width:14px;height:14px;color:var(--violet)}
.chip.ask{color:var(--violet)}
.chip.busy,.chip.busy:hover{color:var(--ink);cursor:default;background:var(--sheet);border-width:2px;padding:0 12px;border-color:var(--think-a);animation:chipThink 1.6s ease-in-out infinite}
.chip.busy svg{animation:chipThinkInk 1.6s ease-in-out infinite}
.chip.quiet{color:var(--ink-3);cursor:default;animation:none}
.chip.quiet:hover{border-color:var(--rule-2);background:var(--sheet)}
@keyframes chipThink{0%,100%{border-color:var(--think-a);box-shadow:0 0 0 3px var(--think-a-soft)}50%{border-color:var(--think-b);box-shadow:0 0 0 3px var(--think-b-soft)}}
@keyframes chipThinkInk{0%,100%{color:var(--think-a)}50%{color:var(--think-b)}}
.ai-btn.on,.ai-btn.on:hover:not(:disabled){background:linear-gradient(145deg,#4A68E0,#8A4CE2);color:#fff;box-shadow:0 2px 10px rgba(124,80,216,.38)}
.ai-btn.on:hover:not(:disabled){filter:brightness(1.1)}
.ai-btn.on svg{stroke-width:1.7}
.mi.ai svg{color:var(--violet)}
.mnote{padding:8px 10px;max-width:260px;font-size:12.5px;line-height:1.4;color:var(--ink-3)}
.dialog.wide{width:min(560px,100%)}
.dialog.onboard{width:min(440px,100%);padding:30px 30px 0;border-radius:22px;text-align:center}
.onboard .ob-mark{width:64px;height:64px;margin:0 auto 16px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#3E5FC6,#7C50D8);box-shadow:0 10px 24px rgba(92,72,200,.32)}
.onboard .ob-mark svg{width:36px;height:36px;stroke-width:1.25;color:#fff}
.onboard h2{font-size:30px;line-height:1.1;margin:0 0 8px}
.onboard .ob-sub{margin:0 auto 22px;max-width:30ch;font-size:15px}
.ob-list{list-style:none;margin:0 0 20px;padding:0 4px;display:grid;gap:16px;text-align:left}
.ob-list li{display:flex;gap:16px;align-items:flex-start;animation:obIn .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.12s + var(--i) * .07s)}
.ob-ic{flex:none;width:38px;display:grid;place-items:center;color:var(--c);padding-top:1px}
.ob-ic svg{width:30px;height:30px;stroke-width:1.3}
.ob-list b{display:block;font-weight:600;font-size:15px;color:var(--ink);margin-bottom:2px}
.ob-list .ob-d{display:block;color:var(--ink-2);font-size:13.5px;line-height:1.45}
.onboard .ob-fine{display:flex;gap:9px;align-items:flex-start;text-align:left;margin:0 0 16px;padding:10px 12px;border-radius:10px;background:var(--paper);font-size:12px;line-height:1.45;color:var(--ink-3)}
.ob-fine svg{width:14px;height:14px;margin-top:1px}
.ob-actions{position:sticky;bottom:0;margin:0 -30px;padding:12px 30px 14px;background:var(--sheet);box-shadow:0 -1px 0 var(--rule)}
.ob-go{width:100%;height:46px;justify-content:center;font-size:15px;border-radius:12px}
.ob-alt{display:block;margin:6px auto 0;border:0;background:transparent;color:var(--cloth-ink);font-weight:500;padding:9px 14px;border-radius:8px}
.ob-alt:hover{background:var(--hover)}
.ob-alt.danger{color:var(--danger)}
@keyframes obIn{from{opacity:0;transform:translateY(10px)}}
.dialog.aiwait{width:min(380px,100%);text-align:center;padding:30px 24px 18px}
.aiwait .actions{justify-content:center}
.ai-orb{width:54px;height:54px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#3E5FC6,#7C50D8);animation:orb 1.6s ease-in-out infinite}
.ai-orb svg{width:26px;height:26px;color:#fff;stroke-width:1.4}
@keyframes orb{50%{transform:scale(1.07);box-shadow:0 0 0 10px rgba(124,80,216,.14)}}
.ai-list{margin:14px 0 6px;max-height:min(50vh,420px);overflow:auto;border:1px solid var(--rule);border-radius:10px;padding:4px}
.ai-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.ai-row:hover{background:var(--hover)}
.ai-row input{margin:4px 0 0;width:16px;height:16px;flex:none;accent-color:var(--cloth)}
.ai-row .ico{margin-top:-1px}
.ai-row .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ai-row .nm b{font-weight:500}
.ai-row .nm small{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-row .new{font-weight:500;overflow-wrap:anywhere}
.ai-row .old{font-size:12.5px;color:var(--ink-3);text-decoration:line-through;overflow-wrap:anywhere}
.ai-row .tag{font-size:12px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:1px}
.ai-row:has(input:not(:checked)) .nm{opacity:.5}
.picks{display:grid;gap:8px;margin-top:14px}
.pick{display:flex;align-items:center;gap:11px;min-height:46px;padding:8px 14px;border-radius:11px;border:1px solid var(--rule-2);background:var(--sheet);font-weight:500;font-size:15px;text-align:left}
.pick:hover,.pick:focus-visible{border-color:var(--cloth);background:var(--cloth-soft)}
.pick svg{color:var(--violet)}

.filedrop{position:fixed;inset:10px;z-index:70;border:2px dashed var(--cloth);border-radius:18px;background:color-mix(in srgb,var(--sheet) 88%,transparent);display:grid;place-items:center;text-align:center;pointer-events:none}
.filedrop div{font:500 26px/1.2 var(--f-display);color:var(--cloth-ink)}
.filedrop small{display:block;font:14px var(--f-ui);color:var(--ink-2);margin-top:6px}
.dragghost{position:fixed;top:-200px;left:0;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;background:var(--tray);color:var(--tray-ink);font-weight:500;font-size:13px;white-space:nowrap;max-width:280px}
.dragghost span{overflow:hidden;text-overflow:ellipsis}
body.dragging .row:hover{background:transparent}
body.dragging .row.sel:hover{background:var(--select)}
.navscrim{display:none}

/* ---------- pane sizes and the rail ----------
   The folders pane and the details pane can be dragged wider or narrower by a handle on their inner edge. The folders
   pane can also collapse into a rail of large icons (the top bar's first button, Ctrl/⌘+B, or dragging it narrow). */
.resizer{position:absolute;top:0;bottom:0;width:10px;z-index:30;cursor:col-resize;touch-action:none}
.resizer::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:2px;transition:background .12s .15s}
.resizer:hover::after,.resizer.active::after,.resizer:focus-visible::after{background:var(--cloth);transition-delay:0s}
.resizer:focus-visible{outline:none}
.side>.resizer{right:-5px}
.insp>.resizer{left:-5px}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none!important}
.rail{display:none;flex:1;min-height:0;flex-direction:column;align-items:center;gap:4px;padding:12px 0;overflow:auto}
.rbtn{position:relative;flex:none;width:42px;height:42px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:var(--ink-2)}
.rbtn svg{width:22px;height:22px;stroke-width:1.35}
.rbtn:hover{background:var(--hover);color:var(--ink)}
.rbtn.on{background:var(--select);color:var(--cloth-ink)}
.rbtn.on::before{content:"";position:absolute;left:-8px;top:11px;bottom:11px;width:3px;border-radius:2px;background:var(--cloth)}
.rbadge{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--manila);color:var(--sheet);font:600 10px/17px var(--f-ui);text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--paper)}
.rsep{flex:none;width:26px;height:1px;background:var(--rule-2);margin:6px 0}
.rspace{flex:1}
.app.blank .rail .rlib{display:none}
@media (min-width:821px){
  .app.side-rail{--side-cur:var(--rail-w)}
  .app.side-rail .side>:not(.rail):not(.resizer){display:none!important}
  .app.side-rail .rail{display:flex}
  .app.side-rail .brand{width:auto}
}

/* ---------- narrow ---------- */
@media (max-width:1000px){ .where{display:none} }
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .only-narrow{display:grid}
  .brand{width:auto}
  .side>.resizer{display:none}
  .file{display:none}
  .top{flex-wrap:wrap;gap:8px}
  .search{order:5;flex:1 0 100%;max-width:none}
  .tools{margin-left:auto}
  .tools .btn .lbl-wide{display:none}
  .side{position:fixed;z-index:40;left:0;top:0;bottom:0;width:min(310px,86vw);transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
  .app.nav-open .side{transform:none}
  .app.nav-open .navscrim{display:block;position:fixed;inset:0;z-index:39;background:var(--scrim)}
  .phead{padding:16px 16px 12px}
  .row,.grp{left:6px;right:6px}
  .ptitle,.ptitle-in{font-size:24px}
}
@media (max-width:600px){
  .tail{flex:0 0 32px}
  .acts .a-edit,.acts .a-go,.acts .a-link{display:none}
  .date{display:none}
  .selbar kbd,.selbar .lbl{display:none}
  .redo-btn{display:none}
  .keep-seg button{padding:0 7px}
  :root{--ind-w:16px}
  .seg button{padding:0 8px}
  .scrim.sheet{place-items:end center;padding:0}
  .scrim.sheet .dialog{width:100%;max-height:94%;border-radius:22px 22px 0 0;padding:30px 22px 0;animation:sheetUp .3s cubic-bezier(.2,.7,.2,1)}
  .onboard .ob-mark{width:60px;height:60px;margin-bottom:14px}
  .onboard .ob-sub{margin-bottom:20px}
  .ob-list{gap:16px}
  .ob-actions{margin:0 -22px;padding:12px 22px calc(10px + env(safe-area-inset-bottom,0px))}
}
@keyframes sheetUp{from{transform:translateY(48px);opacity:0}}
@media (hover:none){
  .check{opacity:1}
  .side-tools{opacity:1}
  .acts{opacity:1;pointer-events:auto}
  .acts .a-edit,.acts .a-go,.acts .a-link{display:none}
  .date{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <button class="icon-btn" id="navBtn" aria-label="Collapse the sidebar" aria-controls="side"></button>
    <div class="brand"><span class="mark" id="brandMark"></span><span class="word">Bindery</span></div>
    <div class="file" id="fileChip"></div>
    <label class="search" id="searchBox"><span id="searchIco"></span><input id="q" type="search" placeholder="Search titles, addresses and #tags" autocomplete="off" spellcheck="false" aria-label="Search bookmarks"><kbd>/</kbd></label>
    <div class="tools">
      <button class="icon-btn ai-btn" id="aiBtn" aria-label="Bindery Assist" aria-haspopup="menu" hidden></button>
      <button class="icon-btn" id="undoBtn" aria-label="Undo"></button>
      <button class="icon-btn redo-btn" id="redoBtn" aria-label="Redo"></button>
      <span class="sep"></span>
      <button class="btn ghost" id="importBtn"></button>
      <button class="btn primary" id="exportBtn"></button>

  <aside class="side" id="side" aria-label="Folders">

      <div class="rows" id="rows" style="position:absolute;inset:0 0 auto 0"></div>
      <div class="dropline" id="listLine" hidden></div>
      <div class="empty" id="empty" hidden></div>

  </main>
  <aside class="insp" id="insp" aria-label="Details" hidden></aside>
</div>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="scrim" id="modal" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>

    update: text => { const p = el.dialog.querySelector('.ai-detail'); if (p) p.textContent = text; },
    async fetch(task, payload) {

      try { return await aiFetch(task, payload, ctrl.signal); }
      catch (e) { throw timedOut ? new AIError('Bindery Assist took too long to answer. Try again, or with fewer bookmarks.') : e; }

    close() { if (!el.modal.hidden && el.dialog.classList.contains('aiwait')) { modalDone = null; closeModal(); } },

/* ---------- tidy review ----------

  const w = aiWaiting(`Finding folders for ${plural(sent.length, 'bookmark')}`,

    catch (e) { failed = e; break; }

async function aiTitles(ids) {
  const links = ids.map(node).filter(n => n?.type === 'link' && !/^javascript:/i.test(n.url));
  if (!links.length) { toast('There are no bookmarks here to clean up.'); return; }
  const sent = links.slice(0, AI_MAX.titles);
  const data = await aiCall('titles', { items: sent.map(aiItem) }, `Cleaning up ${plural(sent.length, 'title')}`,
    `Sending ${sent.length === 1 ? 'this bookmark’s' : 'these bookmarks’'} titles and addresses to Bindery Assist.${links.length > sent.length ? ` That’s the first ${fmt(sent.length)} of ${fmt(links.length)}.` : ''}`);
  if (!data) return;
  const seen = new Set(), changes = [];
  for (const t of Array.isArray(data.titles) ? data.titles : []) {
    const n = sent[t?.item], title = String(t?.title ?? '').trim().slice(0, 200);
    if (!n || !idx.has(n.id) || seen.has(n.id) || !title || title === n.title) continue;
    seen.add(n.id); changes.push({ n, title });
  }
  if (!changes.length) { toast(sent.length === 1 ? 'That title already looks clean.' : 'These titles already look clean. Nothing changed.'); return; }
  const picked = await aiReview({
    title: changes.length === 1 ? 'Clean up this title?' : `Clean up ${fmt(changes.length)} titles?`,
    intro: `Bindery Assist suggests ${changes.length === 1 ? 'a shorter title' : 'these shorter titles'}${sent.length > changes.length ? `. The other ${plural(sent.length - changes.length, 'title')} already looked fine` : ''}. Untick any you want to keep as they are.`,
    rows: changes.map(c => ({ ...c, html: `${iconHTML(c.n)}<span class="nm"><span class="new">${esc(c.title)}</span><span class="old">${esc(c.n.title)}</span></span>` })),
    okLabel: ps => ps.length ? `Rename ${plural(ps.length, 'bookmark')}` : 'Nothing to rename',
  });
  if (!picked?.length) return;
  const live = picked.filter(c => idx.has(c.n.id));
  if (!mutate(`Title cleanup of ${plural(live.length, 'bookmark')}`, () => { for (const c of live) c.n.title = c.title; })) return;
  toast(`Renamed ${plural(live.length, 'bookmark')}`, { undo: true });
}

/* ---------- tags ----------
   Inspect → Tags lists every tag (ignoring case) and the tags that look like the same tag. A tag opens a view of its

      const cur = tagsOf(n), next = dedupeTags(fn(cur, id));

}
/* Every spelling of the given tags becomes `target`. Renaming is merging one tag. */

  const tk = target.toLowerCase(), into = tagIdx.has(tk) && !set.has(tk) ? tagIdx.get(tk).name : null;
  const was = keys.map(k => tagIdx.get(k)?.name).filter(Boolean);
  const view = S.view;
  if (view.kind === 'tag' && set.has(view.key)) S.view = { kind: 'tag', key: tk };
  const ok = retag(ids, keys.length > 1 || into ? `Merging of ${plural(keys.length + (into ? 1 : 0), 'tag')}` : `Renaming of the tag “${was[0]}”`,
    tags => tags.map(t => set.has(t.toLowerCase()) ? target : t));
  if (!ok) { S.view = view; if (!quiet) toast('Nothing to change.'); return false; }
  if (!quiet) toast(into ? `Merged ${was.map(w => `“${w}”`).join(', ')} into “${into}”` : keys.length > 1 ? `Merged ${plural(keys.length, 'tag')} into “${target}”`
    : was[0].toLowerCase() === tk ? `Now spelled “${target}” everywhere` : `Renamed “${was[0]}” to “${target}”`, { undo: true });
  return true;
}
function dropTag(key) {

/* Tags that look like the same tag: different spellings of one tag, plurals, spacing and one-letter typos, plus any

let tagVer = 0, simCache = { ver: -1, groups: [] };
const fuzzyTag = k => k.normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[\s_\-.\/]+/g, '').replace(/ies$/, 'y').replace(/([^s])s$/, '$1');
function oneEdit(a, b) {
  if (a === b) return true;
  const la = a.length, lb = b.length; if (Math.abs(la - lb) > 1) return false;
  let i = 0, j = 0, d = 0;
  while (i < la && j < lb) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++d > 1) return false;
    if (la > lb) i++; else if (lb > la) j++; else { i++; j++; }

}
const simSig = g => g.kind + ':' + [...g.keys].sort().join('\n');
function similarTagGroups() {
  if (simCache.ver === tagVer && simCache.ignore === S.tagIgnore.size && simCache.ai === S.tagAI.length) return simCache.groups;
  const keys = [...tagIdx.keys()], out = [], most = ks => ks.reduce((a, b) => tagIdx.get(b).ids.length > tagIdx.get(a).ids.length ? b : a);
  for (const k of keys) { const e = tagIdx.get(k); if (e.spell.size > 1) out.push({ kind: 'case', keys: [k], target: e.name }); }
  // Union keys that are the same once plurals and spacing are ignored, or one letter apart (5+ letters, no digits).
  const parent = new Map(keys.map(k => [k, k])), find = k => { while (parent.get(k) !== k) k = parent.get(k); return k; };
  const join = (a, b) => { a = find(a); b = find(b); if (a !== b) parent.set(b, a); };

  if (keys.length <= 3000) {
    const fz = [...byFuzzy.keys()].filter(f => f.length >= 5 && !/\d/.test(f)), byLen = new Map();
    for (const f of fz) { const l = f.length; byLen.has(l) ? byLen.get(l).push(f) : byLen.set(l, [f]); }
    for (const f of fz) for (const l of [f.length, f.length + 1]) for (const g of byLen.get(l) || []) if (g > f || l > f.length) if (oneEdit(f, g)) join(byFuzzy.get(f), byFuzzy.get(g));
  }
  const groups = new Map();
  for (const k of keys) { const r = find(k); groups.has(r) ? groups.get(r).push(k) : groups.set(r, [k]); }
  const seen = new Set();
  for (const ks of groups.values()) if (ks.length > 1) { const g = { kind: 'alike', keys: ks, target: tagIdx.get(most(ks)).name }; out.push(g); seen.add([...ks].sort().join('\n')); }
  for (const ks0 of S.tagAI) {
    const ks = [...new Set(ks0)].filter(k => tagIdx.has(k));
    if (ks.length > 1 && !seen.has([...ks].sort().join('\n'))) out.push({ kind: 'ai', keys: ks, target: tagIdx.get(most(ks)).name });
  }
  const groupsOut = out.filter(g => !S.tagIgnore.has(simSig(g)));
  simCache = { ver: tagVer, ignore: S.tagIgnore.size, ai: S.tagAI.length, groups: groupsOut };
  return groupsOut;
}
function simMenu(g, x, y) {
  const names = g.kind === 'case' ? [...tagIdx.get(g.keys[0]).spell.keys()] : g.keys.map(k => tagIdx.get(k).name);
  openMenu(x, y, [
    { heading: g.kind === 'case' ? 'Spell it' : 'Merge into' },
    ...names.map(nm => ({ label: `“${nm}”`, icon: 'tag', run: () => mergeTagKeys(g.keys, nm) })),
    'sep',
    { label: g.kind === 'case' ? 'Keep the different spellings' : 'They’re different tags', icon: 'x', run: () => { S.tagIgnore.add(simSig(g)); refresh(); } },

}
async function findSimilarWithAssist() {
  const tags = [...tagIdx.values()].sort((a, b) => b.ids.length - a.ids.length).slice(0, 600).map(e => e.name);
  if (tags.length < 2) { toast('You need at least two tags to compare.'); return; }
  const data = await aiCall('tagsim', { tags }, `Comparing ${plural(tags.length, 'tag')}`, 'Sending your tag names (nothing else) to Bindery Assist.');
  if (!data) return;
  const groups = (Array.isArray(data.groups) ? data.groups : []).map(g => (Array.isArray(g) ? g : []).filter(i => Number.isInteger(i) && tags[i]).map(i => tags[i].toLowerCase())).filter(g => g.length > 1);
  const before = similarTagGroups().length;
  S.tagAI.push(...groups); refresh();
  const added = similarTagGroups().length - before;
  toast(added ? `Bindery Assist found ${plural(added, 'more group')} of tags that mean the same. They’re at the top.` : 'Bindery Assist didn’t find any more tags that mean the same.');
}

/* ---------- moving tags between browsers ---------- */
const copyOf = n => reassignIds(cloneTree(n));

/* A folder picker in a dialog, with optional form fields above it. Resolves { folder, form } or null. */
function chooseFolderDialog({ title, intro = '', extra = '', ok, start = S.root.id, label = 'Put it in' }) {
  return new Promise(res => {
    let chosen = idx.has(start) ? start : S.root.id;
    openModal(`<h2>${esc(title)}</h2>${intro}${extra}<div class="field"><span class="flabel">${esc(label)}</span>
      <label class="search"><span>${I.search}</span><input data-cf="q" placeholder="Find a folder" autocomplete="off" spellcheck="false" aria-label="Find a folder"></label>
      <div class="mp-list cf-list" role="listbox"></div></div>
      <div class="actions"><button class="btn" data-m="cancel">Cancel</button><button class="btn primary" data-cf="ok">${esc(ok)}</button></div>`, 'wide');
    const list = el.dialog.querySelector('.cf-list'), q = el.dialog.querySelector('[data-cf="q"]');
    const draw = () => {
      const t = q.value.trim().toLowerCase(), all = folderList().filter(x => !t || folderTitle(node(x.id)).toLowerCase().includes(t));
      list.innerHTML = all.map(x => `<div class="mp-row${x.id === chosen ? ' act' : ''}" data-cfid="${x.id}" role="option" aria-selected="${x.id === chosen}" style="--d:${t ? 0 : x.d}">${iconHTML(node(x.id))}<span class="nm"><b>${esc(folderTitle(node(x.id)))}</b>${t && x.id !== S.root.id ? `<small>${esc(folderPath(x.id))}</small>` : ''}</span>${x.id === chosen ? `<span class="tag">${I.check}</span>` : ''}</div>`).join('') || '<div class="mp-label">No folders match</div>';
    };
    list.addEventListener('click', e => { const r = e.target.closest('[data-cfid]'); if (r) { chosen = r.dataset.cfid; draw(); } });
    q.addEventListener('input', draw);
    q.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });
    el.dialog.querySelector('[data-cf="ok"]').addEventListener('click', () => {
      const form = {};
      for (const i of el.dialog.querySelectorAll('[name]')) { if (i.type === 'radio') { if (i.checked) form[i.name] = i.value; } else form[i.name] = i.type === 'checkbox' ? i.checked : i.value; }
      closeModal({ folder: chosen, form });
    });
    modalDone = v => res(v && typeof v === 'object' ? v : null);
    draw(); list.querySelector('.act')?.scrollIntoView({ block: 'nearest' });
  });
}
async function tagToFolder(key) {
  const e = tagIdx.get(key); if (!e) return;
  const r = await chooseFolderDialog({
    title: `Make a folder from “${e.name}”`,
    intro: `<p>${plural(e.ids.length, 'bookmark')} ${e.ids.length === 1 ? 'has' : 'have'} this tag.</p>`,
    extra: `<div class="field"><label for="cfName">Folder name</label><input id="cfName" name="name" value="${esc(e.name)}" autocomplete="off"></div>
      <div class="opts"><label><input type="radio" name="how" value="copy" checked> Put copies in it, and leave the bookmarks where they are</label>
      <label><input type="radio" name="how" value="move"> Move the bookmarks into it</label>

    ok: 'Make folder',

  const name = String(r.form.name || '').trim() || e.name, ids = [...tagIdx.get(key).ids], dest = node(r.folder), move = r.form.how === 'move';
  const untag = n => { if (r.form.untag) setAttr(n, 'TAGS', tagsOf(n).filter(t => t.toLowerCase() !== key).join(',')); };

}

  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" data-t="act">${esc(action.label)}</button>` : ''}${withUndo ? '<button type="button" data-t="undo">Undo</button>' : ''}`;
  if (withUndo) t.querySelector('[data-t="undo"]').onclick = () => { t.remove(); undo(); };
  if (action) t.querySelector('[data-t="act"]').onclick = () => { t.remove(); action.run(); };
  el.toasts.appendChild(t);

  setTimeout(() => t.remove(), ms || (withUndo || action ? 6500 : error ? 7000 : 3800));
}

el.redo.addEventListener('click', redo);
$('keysBtn').addEventListener('click', openKeys);
$('aiBtn').addEventListener('click', () => withAI(() => { const r = $('aiBtn').getBoundingClientRect(); assistMenu(r.right - 280, r.bottom + 6); }));
$('rememberBtn').addEventListener('click', () => setRemember(!S.remember));
$('forgetBtn').addEventListener('click', requestForget);
$('navBtn').addEventListener('click', toggleSidebar);
$('navScrim').addEventListener('click', () => { el.app.classList.remove('nav-open'); applyPanes(); });
let qT = 0;
el.q.addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(applySearch, 90); });
el.q.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); el.q.value = ''; applySearch(); el.list.focus({ preventScroll: true }); }
  else if (e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); clearTimeout(qT); applySearch(); el.list.focus({ preventScroll: true }); S.cursor = null; moveCursor(1, false); }
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  const k = e.key, lk = k.length === 1 ? k.toLowerCase() : k, mod = e.ctrlKey || e.metaKey;
  if (!el.modal.hidden) { if (k === 'Escape') { e.preventDefault(); closeModal(false); } return; }
  if (!el.menu.hidden) { if (k === 'Escape') { closeMenu(); } return; }
  const field = e.target.closest?.('input,textarea,select,[contenteditable="true"]');
  if (mod && lk === 'k') { e.preventDefault(); el.q.focus(); el.q.select(); return; }
  if (mod && lk === 'b' && !e.shiftKey && !e.altKey) { e.preventDefault(); toggleSidebar(); return; }
  if (field) return;
  if (mod && lk === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && lk === 'y') { e.preventDefault(); redo(); return; }
  if (isBlank()) { if (k === '?') { e.preventDefault(); openKeys(); } return; }
  if (mod && lk === 'a') { e.preventDefault(); selectAll(); return; }
  if (mod && lk === 'x') { if (S.sel.size) { e.preventDefault(); cut(selIds()); } return; }
  if (mod && lk === 'v') { if (S.clip) { e.preventDefault(); paste(); } return; }
  if (e.altKey && k === 'ArrowUp') { e.preventDefault(); goUp(); return; }
  if (mod || e.altKey) return;
  if ((k === 'Enter' || k === ' ') && e.target.closest?.('button,a')) return;
  if (S.view.kind === 'tags') {
    const key = S.cursor?.startsWith('tag:') ? S.cursor.slice(4) : null;
    if ((lk === 'Enter' || lk === 'ArrowRight') && key) { e.preventDefault(); openTag(key); return; }
    if (lk === 'F2' && key) { e.preventDefault(); tagRename(key); return; }
    if ((lk === 'Delete' || lk === 'Backspace') && key) { e.preventDefault(); dropTag(key); return; }
    if (['Enter', 'F2', 'Delete', 'Backspace', 'ArrowLeft', 'e', 'g', 'n', 'm', 'k', 'd', ' ', 't'].includes(lk)) return;
  }
  if (S.view.kind === 'tag' && lk === 'ArrowLeft') { e.preventDefault(); setView({ kind: 'tags' }); return; }
  if (S.view.kind === 'tidy') {
    const ids = S.sel.size ? selIds() : S.cursor ? [S.cursor] : [];
    if (lk === 'k' || lk === 'd') { e.preventDefault(); if (ids.length) tidySetOff(ids, lk === 'd'); return; }
    if (lk === 'm') {
      e.preventDefault(); if (!ids.length) return;
      const row = el.rows.querySelector(`.row[data-id="${S.cursor || ids[0]}"]`)?.getBoundingClientRect();
      tidySendMenu(ids, row ? row.right - 280 : innerWidth / 2, row ? row.bottom + 4 : innerHeight / 2); return;
    }
    if (['Enter', 'F2', 'Delete', 'Backspace', 'g', 'n', 'e'].includes(lk)) return;
  }
  switch (lk) {
    case 'ArrowDown': case 'ArrowUp': e.preventDefault(); el.list.focus({ preventScroll: true }); moveCursor(k === 'ArrowDown' ? 1 : -1, e.shiftKey); break;
    case 'Home': case 'End': e.preventDefault(); S.cursor = null; moveCursor(k === 'Home' ? 1 : -1, false); break;
    case 'ArrowRight': {
      const n = node(S.cursor); if (n?.type !== 'folder') break;
      e.preventDefault(); el.list.focus({ preventScroll: true });
      if (S.view.kind !== 'tree') { openFolder(n.id); break; }
      if (!S.open.has(n.id)) { if (n.children.length) toggleOpen(n.id, e.shiftKey); }
      else if (n.children.length) moveCursor(1, false);
      break;
    }
    case 'ArrowLeft': {
      e.preventDefault(); el.list.focus({ preventScroll: true });
      if (S.view.kind !== 'tree') { goUp(); break; }
      const n = node(S.cursor); if (!n) break;
      if (n.type === 'folder' && S.open.has(n.id)) { toggleOpen(n.id, e.shiftKey); break; }
      const p = parentOf(n.id);
      if (p && p !== S.root && S.rowPos.has(p.id)) { selectOnly(p.id); ensureVisible(S.rowPos.get(p.id)); renderList(); renderSelbar(); syncSideHighlight(); }
      break;
    }
    case 't': if (S.view.kind === 'tree' || S.view.kind === 'folder') { e.preventDefault(); setLayout(S.view.kind === 'tree' ? 'folder' : 'tree'); } break;
    case 'Enter': case 'F2': { const id = S.cursor && S.sel.has(S.cursor) ? S.cursor : selIds()[0]; if (id) { e.preventDefault(); startEdit(id, 'list'); } break; }
    case ' ': if (S.cursor) { e.preventDefault(); toggleSel(S.cursor); markSel(); renderSelbar(); } break;
    case 'Delete': case 'Backspace': if (S.sel.size) { e.preventDefault(); requestDelete(selIds()); } break;
    case 'm': if (S.sel.size) { e.preventDefault(); openMovePicker(selIds()); } break;
    case 'g': if (S.sel.size) { e.preventDefault(); group(selIds()); } break;
    case 'k': case 'd': if (S.view.kind === 'dupes') { const ids = S.sel.size ? selIds() : S.cursor ? [S.cursor] : []; if (ids.length) { e.preventDefault(); setMarks(ids, lk === 'd'); } } break;
    case 'b': e.preventDefault(); openNewBookmark(); break;
    case 'e': if (S.cursor || S.sel.size) { e.preventDefault(); openEditor(); } break;
    case 'n': if (S.view.kind === 'folder') { e.preventDefault(); newFolder(S.view.id, 0); }
      else if (S.view.kind === 'tree') { e.preventDefault(); const t = treeInsertPoint(); newFolder(t.folder, t.at); } break;
    case '/': e.preventDefault(); el.q.focus(); el.q.select(); break;
    case 'f': e.preventDefault(); setTreeFilterOpen(true); break;
    case '?': e.preventDefault(); openKeys(); break;
    case 'Escape':
      if (S.clip) { S.clip = null; renderList(); renderTree(); renderHead(); }
      else if (S.sel.size) { S.sel.clear(); S.cursor = null; markSel(); renderSelbar(); }
      else if (S.view.kind === 'search') { el.q.value = ''; applySearch(); }
      else if (S.insp) closeEditor();
      el.app.classList.remove('nav-open');
      break;
  }
});

/* ---------- static chrome ---------- */
$('brandMark').innerHTML = I.ribbon;
$('searchIco').innerHTML = I.search;
$('tfIco').innerHTML = I.filter;
$('tfClose').innerHTML = I.x;
renderTreeTools();
$('navBtn').innerHTML = I.side;
$('aiBtn').innerHTML = I.sparkles;
el.undo.innerHTML = I.undo; el.redo.innerHTML = I.redo;
$('importBtn').innerHTML = `${I.import}<span class="lbl-wide">Import</span>`;
$('exportBtn').innerHTML = `${I.export}<span>Export</span>`;
$('importBtn').title = 'Open a bookmarks .html file';
$('keysBtn').innerHTML = `<span class="ficon plain" style="color:inherit">${I.keyboard}</span><span class="tname">Keyboard shortcuts</span><kbd>?</kbd>`;
$('rememberBtn').innerHTML = `<span class="ficon plain" style="color:inherit">${I.device}</span><span class="tname">Remember my file</span><span class="switch" aria-hidden="true"></span>`;
$('rememberBtn').title = 'Keep your bookmarks in this browser so they reopen on your next visit';
$('forgetBtn').innerHTML = `<span class="ficon plain" style="color:inherit">${I.trash}</span><span class="tname">Forget on this device</span>`;

/* ---------- boot ---------- */
if (!restore()) loadRoot(blankRoot(), null, true);
else toast(`Picked up where you left off with ${S.fileName || 'your bookmarks'}.`);

})();
</script>

</body>
</html>
