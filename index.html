<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; manifest-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Open a browser bookmarks export, inspect and reorganize every folder and link, review duplicates, and export a Chrome-ready file. Runs entirely in your browser.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121615" media="(prefers-color-scheme: dark)">
</head>
<body>
<title>Bookmark Bindery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&display=swap">
<style>
/* Layout: a bindery bench. The folder spine runs down the left, the open folder lies flat on a white sheet to the right,
   and whatever you pick up rides in a dark tray at the bottom until you put it somewhere. */
:root{
  --paper:#F2F4F1; --sheet:#FFFFFF; --ink:#1A201E; --ink-2:#56605B; --ink-3:#8A928E;
  --rule:#E1E5E1; --rule-2:#CFD5D0;
  --cloth:#2F4E9E; --cloth-ink:#253F80; --cloth-soft:#E7ECF8; --on-cloth:#FFFFFF;
  --hover:#EEF0EC; --select:#E2E8F7; --focus:#2F4E9E;
  --manila:#A97E2F; --manila-fill:#F5E9CF;
  --danger:#B13A2E; --danger-soft:#FAE9E6; --on-danger:#FFFFFF;
  --tray:#1D2422; --tray-ink:#F1F3F0; --tray-dim:#9AA49F; --tray-hover:#2C3532; --tray-danger:#F2907F;
  --scrim:rgba(18,24,22,.38);
  --tile-s:38%; --tile-l:91%; --tile-ink:34%;
  --shadow:0 1px 2px rgba(20,28,25,.06),0 10px 30px rgba(20,28,25,.12);
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-ui:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --side-w:276px; --ind-w:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121615; --sheet:#181D1B; --ink:#E5E9E6; --ink-2:#A4ADA8; --ink-3:#727B77;
  --rule:#252B29; --rule-2:#343B38;
  --cloth:#93A8F0; --cloth-ink:#B8C6F6; --cloth-soft:#1E2640; --on-cloth:#0F1630;
  --hover:#1F2523; --select:#1F2944; --focus:#93A8F0;
  --manila:#D4AD62; --manila-fill:#3A3020;
  --danger:#EC7A6E; --danger-soft:#3A1F1C; --on-danger:#24100D;
  --tray:#E7EBE8; --tray-ink:#151A18; --tray-dim:#5E6763; --tray-hover:#D3D9D5; --tray-danger:#A9322A;
  --scrim:rgba(0,0,0,.55);
  --tile-s:28%; --tile-l:24%; --tile-ink:80%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#121615; --sheet:#181D1B; --ink:#E5E9E6; --ink-2:#A4ADA8; --ink-3:#727B77;
  --rule:#252B29; --rule-2:#343B38;
  --cloth:#93A8F0; --cloth-ink:#B8C6F6; --cloth-soft:#1E2640; --on-cloth:#0F1630;
  --hover:#1F2523; --select:#1F2944; --focus:#93A8F0;
  --manila:#D4AD62; --manila-fill:#3A3020;
  --danger:#EC7A6E; --danger-soft:#3A1F1C; --on-danger:#24100D;
  --tray:#E7EBE8; --tray-ink:#151A18; --tray-dim:#5E6763; --tray-hover:#D3D9D5; --tray-danger:#A9322A;
  --scrim:rgba(0,0,0,.55);
  --tile-s:28%; --tile-l:24%; --tile-ink:80%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
kbd{font:500 11px/1 var(--f-mono);padding:3px 5px;border-radius:4px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink-2)}

.app{height:100%;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}

/* ---------- top bar ---------- */
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--paper);min-width:0}
.brand{display:flex;align-items:center;gap:8px;flex:none;width:calc(var(--side-w) - 28px);min-width:0}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--cloth);color:var(--on-cloth);display:grid;place-items:center}
.brand .mark svg{width:15px;height:15px;stroke-width:1.7}
.brand .word{font:italic 500 21px/1 var(--f-display);letter-spacing:-.01em}
.file{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.file b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.file span{font-size:12px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.file .dirty{color:var(--manila)}
.search{flex:1;max-width:520px;margin-left:auto;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:9px;background:var(--sheet);border:1px solid var(--rule-2);color:var(--ink-3);min-width:0}
.search:focus-within{border-color:var(--cloth);box-shadow:0 0 0 3px var(--cloth-soft)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.tools{display:flex;align-items:center;gap:6px;flex:none}
.sep{width:1px;height:20px;background:var(--rule-2);margin:0 4px}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--rule-2);background:var(--sheet);font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--cloth);border-color:transparent;color:var(--on-cloth)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:transparent;color:var(--on-danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn svg{color:currentColor}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:0;background:transparent;color:var(--ink-2)}
.icon-btn:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.icon-btn:disabled{opacity:.35;cursor:default}
.only-narrow{display:none}

/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule);background:var(--paper)}
.side-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:16px 18px 6px}
.tree{position:relative;flex:1;min-height:80px;overflow:auto;padding:0 8px 8px}
.trow{position:relative;display:flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 calc(4px + var(--d) * 14px);border-radius:7px;color:var(--ink-2);cursor:pointer;user-select:none}
.trow:hover{background:var(--hover);color:var(--ink)}
.trow.on{background:var(--select);color:var(--cloth-ink);font-weight:500}
.trow.on .ficon{color:var(--cloth)}
.trow.drop-into{background:var(--cloth-soft);box-shadow:inset 0 0 0 1.5px var(--cloth)}
.trow.cut{opacity:.5}
.chev{width:18px;height:18px;display:grid;place-items:center;border:0;padding:0;background:transparent;color:var(--ink-3);border-radius:4px;flex:none}
.chev svg{width:12px;height:12px;stroke-width:1.8;transition:transform .15s}
.chev.open svg{transform:rotate(90deg)}
.chev.none{visibility:hidden}
.chev:hover{color:var(--ink)}
.ficon{display:grid;place-items:center;color:var(--manila)}
.ficon svg{fill:var(--manila-fill)}
.ficon.plain svg{fill:none}
.trow.on .ficon svg{fill:var(--cloth-soft)}
.tname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcount{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:400}
.trow .in-t{flex:1;min-width:0;height:24px}
.views{display:flex;flex-direction:column;padding:0 8px}
.vrow{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px 0 12px;border-radius:7px;border:0;background:transparent;color:var(--ink-2);text-align:left}
.vrow:hover{background:var(--hover);color:var(--ink)}
.vrow.on{background:var(--select);color:var(--cloth-ink);font-weight:500}
.vrow .tname{flex:1}
.side-foot{padding:10px 8px 14px;border-top:1px solid var(--rule);margin-top:10px}
.side-foot .vrow{width:100%}
.side-foot .side-h{padding:4px 12px 6px}
.vrow:disabled{opacity:.4;cursor:default}
.vrow:disabled:hover{background:transparent;color:var(--ink-2)}
.vrow.danger{color:var(--danger)}
.vrow.danger:hover:not(:disabled){background:var(--danger-soft);color:var(--danger)}
.switch{position:relative;flex:none;width:28px;height:16px;border-radius:8px;border:1.5px solid var(--ink-3);transition:background .15s,border-color .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;background:var(--ink-3);transition:transform .15s,background .15s}
.vrow[aria-checked="true"] .switch{background:var(--cloth);border-color:var(--cloth)}
.vrow[aria-checked="true"] .switch::after{background:var(--on-cloth);transform:translateX(12px)}
.dev-note{margin:2px 12px 10px;font-size:12px;line-height:1.4;color:var(--ink-3)}
.dropline{position:absolute;height:2px;background:var(--cloth);border-radius:2px;pointer-events:none;z-index:3}
.dropline::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;border:2px solid var(--cloth);background:var(--sheet)}

/* ---------- pane ---------- */
.pane{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--sheet)}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;padding:20px 24px 14px;border-bottom:1px solid var(--rule)}
.phead .ttl{flex:1 1 280px;min-width:0}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;min-height:20px;margin-bottom:4px;color:var(--ink-3);font-size:12.5px}
.crumbs svg{width:11px;height:11px;stroke-width:1.8}
.crumb{border:0;background:transparent;padding:1px 5px;border-radius:5px;color:var(--ink-2)}
.crumb:hover{background:var(--hover);color:var(--ink)}
.crumb.drop-into{background:var(--cloth-soft);color:var(--cloth-ink);box-shadow:inset 0 0 0 1.5px var(--cloth)}
.ptitle{margin:0;font:500 28px/1.15 var(--f-display);letter-spacing:-.012em;text-wrap:balance;overflow-wrap:anywhere}
.ptitle[data-rename]{cursor:text}
.ptitle-in{font:500 28px/1.15 var(--f-display);letter-spacing:-.012em;width:100%;border:0;outline:none;background:transparent;border-bottom:1.5px solid var(--cloth);padding:0}
.pmeta{margin-top:5px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pmeta .dim{color:var(--ink-3)}
.pacts{display:flex;flex-wrap:wrap;gap:6px}
.list{position:relative;flex:1;min-height:0;overflow:auto;outline:none}
.rows{position:relative}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink-3);pointer-events:none}
.empty h3{margin:0 0 4px;font:500 20px/1.2 var(--f-display);color:var(--ink-2)}
.empty p{margin:0;max-width:42ch}
.empty .watermark{display:block;width:112px;height:112px;margin:0 auto 20px;stroke:none;color:var(--cloth);opacity:.14}
.empty .watermark rect{fill:currentColor}
.empty .watermark path{fill:var(--sheet)}
.empty.blank-state h3{font-size:26px;margin-bottom:6px}
.empty.blank-state p{margin-inline:auto}
.empty .how{margin-top:12px;font-size:12.5px}
.app.blank .phead,.app.blank #tree,.app.blank #views,.app.blank .side-h.lib{display:none}
.app.blank .side-foot{margin-top:auto}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{background:var(--sheet);filter:none}
.btn.primary:disabled:hover{background:var(--cloth)}
.search:has(input:disabled){opacity:.55}
.dialog h2.problem{color:var(--danger)}

.row{position:absolute;left:12px;right:12px;height:44px;display:flex;align-items:center;gap:10px;padding:0 6px 0 8px;border-radius:9px;user-select:none;-webkit-user-select:none}
.row:hover{background:var(--hover)}
.row.sel{background:var(--select)}
.list:focus .row.cur{box-shadow:inset 0 0 0 1.5px var(--focus)}
.row.cut{opacity:.42}
.row.drop-into{background:var(--cloth-soft);box-shadow:inset 0 0 0 1.5px var(--cloth)}
.row[data-editing]{background:var(--sheet);box-shadow:0 0 0 1px var(--rule-2),var(--shadow);z-index:2}
.check{width:18px;height:18px;flex:none;display:grid;place-items:center;border-radius:5px;border:1.5px solid var(--rule-2);background:var(--sheet);opacity:0;transition:opacity .1s}
.check svg{width:12px;height:12px;stroke-width:2.2;opacity:0}
.row:hover .check,.selecting .check{opacity:1}
.row.sel .check{background:var(--cloth);border-color:var(--cloth);color:var(--on-cloth)}
.row.sel .check svg{opacity:1}
.ico{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:6px;font:600 11.5px/1 var(--f-ui);overflow:hidden}
.ico img{width:16px;height:16px}
.ico.mono{background:hsl(var(--h) var(--tile-s) var(--tile-l));color:hsl(var(--h) 42% var(--tile-ink))}
.ico.fold{color:var(--manila)}
.ico.fold svg{width:20px;height:20px;stroke-width:1.3;fill:var(--manila-fill)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px}
.t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u{font:12px/1.35 var(--f-mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is-folder .u{font-family:var(--f-ui);font-size:12.5px}
.u .pill{font:600 10.5px/1 var(--f-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--manila);background:var(--manila-fill);padding:2px 6px;border-radius:4px}
mark{background:var(--manila-fill);color:inherit;border-radius:2px;box-shadow:0 0 0 1px var(--manila-fill)}
.where{flex:0 0 26%;min-width:0;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tail{position:relative;flex:0 0 104px;height:100%;display:flex;align-items:center;justify-content:flex-end}
.date{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-right:6px}
.acts{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;gap:2px;opacity:0;pointer-events:none}
.row:hover .acts,.list:focus .row.cur .acts{opacity:1;pointer-events:auto}
.row:hover .date,.list:focus .row.cur .date{opacity:0}
.acts .icon-btn{width:30px;height:30px;text-decoration:none}
.row.sel .acts .icon-btn:hover{background:var(--sheet)}
.main.editing{gap:3px}
.in-t,.in-u{width:100%;border:0;outline:1.5px solid var(--cloth);outline-offset:0;border-radius:5px;background:var(--sheet);padding:1px 6px;margin-left:-6px;min-width:0}
.in-t{font-weight:500;height:21px}
.in-u{font:12px/1.35 var(--f-mono);height:18px;color:var(--ink-2);outline-color:var(--rule-2)}
.in-u:focus{outline-color:var(--cloth)}
.grp{position:absolute;left:12px;right:12px;height:44px;display:flex;align-items:flex-end;gap:10px;padding:0 0 3px 8px;font:600 13px/1.3 var(--f-ui);color:var(--ink);border-bottom:1px solid var(--rule)}
.grp .gl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:5px}
.grp .mono{font:400 12px var(--f-mono);color:var(--ink-2)}
.grp .gl .mono:first-child{color:var(--ink);font-size:12.5px}
.grp .dim{color:var(--ink-3);margin-left:6px}
.grp .n{font:400 12px var(--f-ui);color:var(--ink-3);white-space:nowrap;padding-bottom:5px;font-variant-numeric:tabular-nums}
.grp.wiped .n{color:var(--danger);font-weight:500}
.grp .icon-btn{width:28px;height:28px}
.row.marked:not(.sel){background:var(--danger-soft)}
.row.marked .main{opacity:.6}
.row.marked .t{text-decoration:line-through;text-decoration-color:var(--danger);text-decoration-thickness:1.5px}
.keep-seg,.seg{flex:none;display:inline-flex;padding:2px;gap:2px;border-radius:8px;background:var(--paper);border:1px solid var(--rule)}
.keep-seg button,.seg button{border:0;background:transparent;border-radius:6px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.keep-seg button{height:26px;padding:0 10px;font-size:12.5px}
.keep-seg button:hover,.seg button:hover{color:var(--ink)}
.keep-seg button.on[data-a="keep"],.seg button.on{background:var(--sheet);color:var(--ink);box-shadow:0 0 0 1px var(--rule-2)}
.keep-seg button.on[data-a="del"]{background:var(--danger);color:var(--on-danger)}
.seg{padding:2px}
.seg button{height:26px;padding:0 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.seg .sc{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pmeta .del{color:var(--danger);font-weight:600}
.pmeta div.dim{margin-top:2px;font-size:12.5px}
.selbar .fill-danger{background:var(--tray-danger);color:var(--tray)}
.selbar .fill-danger:hover{background:var(--tray-danger);filter:brightness(1.08)}
.dialog p.warn{color:var(--danger);font-weight:500}
.urlcmp{display:grid;gap:6px;margin:14px 0 12px}
.urlcmp .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.urlcmp code{display:block;font:12.5px/1.55 var(--f-mono);padding:9px 11px;border-radius:8px;background:var(--paper);border:1px solid var(--rule);overflow-wrap:anywhere;word-break:break-all;max-height:9.5em;overflow:auto;color:var(--ink)}
.urlcmp del{text-decoration:line-through;text-decoration-color:var(--danger);background:var(--danger-soft);color:var(--danger);border-radius:3px}
.dialog .pk{font:12px var(--f-mono);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:0 4px}
.dialog p.note{font-size:12.5px;color:var(--ink-3)}
.preview .pv-where{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%;padding-left:8px}
.preview li .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#listLine{left:16px;right:16px}
.tw{--ind:var(--ind-w);flex:none;align-self:stretch;display:flex;align-items:center;margin-right:-4px}
.tw .indent{align-self:stretch;margin-block:-1px;width:calc(var(--d) * var(--ind));background:linear-gradient(to right,transparent calc(50% - .5px),var(--rule-2) calc(50% - .5px),var(--rule-2) calc(50% + .5px),transparent calc(50% + .5px)) 0 0/var(--ind) 100% repeat-x}
.twist{width:var(--ind);height:24px;flex:none;display:grid;place-items:center;border:0;padding:0;background:transparent;color:var(--ink-3);border-radius:5px}
.twist svg{width:12px;height:12px;stroke-width:1.9;transition:transform .15s}
.twist.open svg{transform:rotate(90deg)}
.twist.none{visibility:hidden}
.twist:hover{background:var(--rule);color:var(--ink)}
.seg svg{width:14px;height:14px}

/* ---------- selection tray & toasts ---------- */
.dock{position:absolute;left:0;right:0;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none;z-index:20}
.dock>*{pointer-events:auto}
.toast,.selbar{background:var(--tray);color:var(--tray-ink);border-radius:12px;box-shadow:var(--shadow);max-width:100%}
.toast{display:flex;align-items:center;gap:14px;padding:10px 10px 10px 16px;font-size:13.5px;animation:rise .18s ease-out}
.toast.err{background:var(--danger);color:var(--on-danger)}
.toast button{border:0;background:transparent;color:inherit;font-weight:600;padding:4px 8px;border-radius:6px;text-decoration:underline;text-underline-offset:3px}
.toast button:hover{background:var(--tray-hover)}
.selbar{display:flex;align-items:center;gap:2px;padding:6px;animation:rise .18s ease-out}
.selbar .count{padding:0 12px 0 10px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.selbar button{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px;border:0;border-radius:8px;background:transparent;color:inherit;font-weight:500;white-space:nowrap}
.selbar button:hover{background:var(--tray-hover)}
.selbar kbd{background:transparent;border-color:var(--tray-dim);color:var(--tray-dim)}
.selbar .danger{color:var(--tray-danger)}
.selbar .x{width:34px;padding:0;justify-content:center;color:var(--tray-dim)}
.selbar .div{width:1px;height:20px;background:var(--tray-hover);margin:0 4px}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ---------- menus & dialogs ---------- */
.menu{position:fixed;z-index:50;min-width:220px;padding:5px;border-radius:11px;background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow)}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border:0;border-radius:7px;background:transparent;text-align:left;color:var(--ink);text-decoration:none;font-size:13.5px}
.mi svg{color:var(--ink-3)}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:none}
.mi span{flex:1}
.mi kbd{border:0;background:transparent;padding:0;color:var(--ink-3)}
.mi.danger,.mi.danger svg{color:var(--danger)}
.mi.danger:hover{background:var(--danger-soft)}
.msep{height:1px;background:var(--rule);margin:5px 6px}
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:16px;animation:fade .15s}
.dialog{width:min(500px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--sheet);border-radius:14px;box-shadow:var(--shadow);padding:22px 22px 18px;animation:rise .18s ease-out}
.dialog h2{margin:0 0 8px;font:500 23px/1.2 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.dialog p{margin:0 0 10px;color:var(--ink-2)}
.dialog .actions{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;margin-top:18px}
.dialog .actions .hint{margin-right:auto;font-size:12px;color:var(--ink-3)}
.preview{list-style:none;margin:12px 0 0;padding:6px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.preview li{display:flex;align-items:center;gap:9px;padding:4px 6px;min-width:0}
.preview li .t{font-weight:400}
.preview .more{color:var(--ink-3);font-size:12.5px;padding-left:39px}
.preview .ico{width:20px;height:20px;font-size:10px}
.preview .ico.fold svg{width:17px;height:17px}
.mp-list{margin-top:10px;max-height:min(46vh,380px);overflow:auto;border:1px solid var(--rule);border-radius:10px;padding:4px}
.mp-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px 4px}
.mp-row{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 10px 4px calc(10px + var(--d) * 16px);border-radius:7px;cursor:pointer}
.mp-row .ico{width:20px;height:20px}
.mp-row .ico svg{width:17px;height:17px}
.mp-row .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.mp-row .nm b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-row .nm small{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-row .tag{font-size:11.5px;color:var(--ink-3)}
.mp-row.act{background:var(--select)}
.mp-row.dis{opacity:.4;cursor:not-allowed}
.dialog .search{max-width:none;margin:0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;margin:14px 0 4px;align-items:center}
.keys dt{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.keys dd{margin:0;color:var(--ink-2)}
.keys .h{grid-column:1/-1;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
@keyframes fade{from{opacity:0}}

.filedrop{position:fixed;inset:10px;z-index:70;border:2px dashed var(--cloth);border-radius:18px;background:color-mix(in srgb,var(--sheet) 88%,transparent);display:grid;place-items:center;text-align:center;pointer-events:none}
.filedrop div{font:500 26px/1.2 var(--f-display);color:var(--cloth-ink)}
.filedrop small{display:block;font:14px var(--f-ui);color:var(--ink-2);margin-top:6px}
.dragghost{position:fixed;top:-200px;left:0;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;background:var(--tray);color:var(--tray-ink);font-weight:500;font-size:13px;white-space:nowrap;max-width:280px}
.dragghost span{overflow:hidden;text-overflow:ellipsis}
body.dragging .row:hover{background:transparent}
body.dragging .row.sel:hover{background:var(--select)}
.navscrim{display:none}

/* ---------- narrow ---------- */
@media (max-width:1000px){ .where{display:none} }
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .only-narrow{display:grid}
  .brand{width:auto}
  .file{display:none}
  .top{flex-wrap:wrap;gap:8px}
  .search{order:5;flex:1 0 100%;max-width:none}
  .tools{margin-left:auto}
  .tools .btn .lbl-wide{display:none}
  .side{position:fixed;z-index:40;left:0;top:0;bottom:0;width:min(310px,86vw);transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
  .app.nav-open .side{transform:none}
  .app.nav-open .navscrim{display:block;position:fixed;inset:0;z-index:39;background:var(--scrim)}
  .phead{padding:16px 16px 12px}
  .row,.grp{left:6px;right:6px}
  .ptitle,.ptitle-in{font-size:24px}
}
@media (max-width:600px){
  .tail{flex:0 0 32px}
  .acts .a-edit,.acts .a-go,.acts .a-link{display:none}
  .date{display:none}
  .selbar kbd,.selbar .lbl{display:none}
  .redo-btn{display:none}
  .keep-seg button{padding:0 7px}
  :root{--ind-w:16px}
  .seg button{padding:0 8px}
}
@media (hover:none){
  .check{opacity:1}
  .acts{opacity:1;pointer-events:auto}
  .acts .a-edit,.acts .a-go,.acts .a-link{display:none}
  .date{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    throw new FileProblem(`${q} isn’t a text file`, 'It looks like an image, archive or other binary file, or it’s damaged. Choose the .html file your browser exported.');

function startEdit(id, where) {

  } else if (where === 'tree') {
    for (const a of ancestors(id)) S.expanded.add(a.id);

/* The query string is everything from "?" up to "#" (a fragment, if any, is kept). */

}

/* ---------- toasts ---------- */
function toast(msg, { undo: withUndo = false, error = false, ms } = {}) {
  const t = document.createElement('div');
  t.className = 'toast' + (error ? ' err' : '');
  t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>${withUndo ? '<button type="button">Undo</button>' : ''}`;
  if (withUndo) t.querySelector('button').onclick = () => { t.remove(); undo(); };
  el.toasts.appendChild(t);
  while (el.toasts.children.length > 2) el.toasts.firstChild.remove();
  setTimeout(() => t.remove(), ms || (withUndo ? 6500 : error ? 7000 : 3800));
}

/* ---------- import / export ---------- */
async function importFile(file) {
  if (!file) return;
  let text, root;
  try { text = await file.text(); }
  catch { showProblem(new FileProblem(`Bindery couldn’t read “${file.name}”`, 'Your browser couldn’t open the file. If it’s on a network or cloud drive, copy it to this computer and try again.')); return; }
  try { root = parseBookmarks(text, file.name); }
  catch (err) { showProblem(err instanceof FileProblem ? err : new FileProblem(`Bindery couldn’t open “${file.name}”`, `Something in the file stopped it from loading. ${REEXPORT}`)); return; }
  if (S.dirty && !S.noFile) {
    const ok = await confirmDialog({ title: 'Open a different file?', body: `<p>Your edits to “${esc(S.fileName)}” haven’t been exported yet. Opening “${esc(file.name)}” replaces them.</p>`, ok: 'Open file', danger: true, focusOk: false });
    if (!ok) return;
  }
  loadRoot(root, file.name, false);
  toast(root.children.length ? `Opened ${file.name}: ${plural(stats.links, 'bookmark')} in ${plural(stats.folders, 'folder')}` : `Opened ${file.name}. It has no bookmarks or folders.`);
}

    openModal(`<h2 class="problem">${esc(p.title)}</h2><p>${esc(p.message)}</p><p class="note">${kept}</p><div class="actions"><button class="btn primary" data-m="ok">OK</button></div>`);

    el.dialog.querySelector('[data-m="ok"]').focus();

}

  undoStack = []; redoStack = []; S.clip = null; S.recent = [];
  reindex();

  const bar = root.children.find(isBar);

    case 'n': if (S.view.kind === 'folder') { e.preventDefault(); newFolder(S.view.id, 0); }
      else if (S.view.kind === 'tree') { e.preventDefault(); const t = treeInsertPoint(); newFolder(t.folder, t.at); } break;
    case '/': e.preventDefault(); el.q.focus(); el.q.select(); break;
    case '?': e.preventDefault(); openKeys(); break;
    case 'Escape':
      if (S.clip) { S.clip = null; renderList(); renderTree(); renderHead(); }
      else if (S.sel.size) { S.sel.clear(); S.cursor = null; markSel(); renderSelbar(); }
      else if (S.view.kind === 'search') { el.q.value = ''; applySearch(); }
      el.app.classList.remove('nav-open');
      break;
  }
});

/* ---------- static chrome ---------- */
$('brandMark').innerHTML = I.ribbon;
$('searchIco').innerHTML = I.search;
$('navBtn').innerHTML = I.side;
el.undo.innerHTML = I.undo; el.redo.innerHTML = I.redo;
$('importBtn').innerHTML = `${I.import}<span class="lbl-wide">Import</span>`;
$('exportBtn').innerHTML = `${I.export}<span>Export</span>`;
$('importBtn').title = 'Open a bookmarks .html file';
$('keysBtn').innerHTML = `<span class="ficon plain" style="color:inherit">${I.keyboard}</span><span class="tname">Keyboard shortcuts</span><kbd>?</kbd>`;
$('rememberBtn').innerHTML = `<span class="ficon plain" style="color:inherit">${I.device}</span><span class="tname">Remember my file</span><span class="switch" aria-hidden="true"></span>`;
$('rememberBtn').title = 'Keep your bookmarks in this browser so they reopen on your next visit';
$('forgetBtn').innerHTML = `<span class="ficon plain" style="color:inherit">${I.trash}</span><span class="tname">Forget on this device</span>`;

/* ---------- boot ---------- */
if (!restore()) loadRoot(blankRoot(), null, true);
else toast(`Picked up where you left off with ${S.fileName || 'your bookmarks'}.`);

})();
</script>
